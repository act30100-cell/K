    padding:5px 11px; border-radius:100px; letter-spacing:0.2px;
  }

  /* ── 캐러셀 ── */
  .viewport{
    flex:1 1 auto; min-height:0; position:relative;
  }
  .track{
    height:100%; display:flex;
    overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .track::-webkit-scrollbar{ display:none; }
  .slide{
    flex:0 0 100%; height:100%;
    scroll-snap-align:center; scroll-snap-stop:always;
    display:flex; align-items:center; justify-content:center;
    padding:14px;
  }
  .slide img{
    max-width:100%; max-height:100%;
    width:auto; height:auto;
    object-fit:contain;
    background:#fff;
    border-radius:6px;
    box-shadow:0 2px 14px rgba(0,0,0,.13);
    display:block;
  }

  /* ── 좌우 버튼 (마우스 환경) ── */
  .nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:42px; height:42px; border:none; border-radius:50%;
    background:rgba(255,255,255,.94); box-shadow:0 2px 10px rgba(0,0,0,.16);
    cursor:pointer; display:none; align-items:center; justify-content:center;
    color:var(--ink); font-size:19px; line-height:1;
  }
  .nav.prev{ left:14px; } .nav.next{ right:14px; }
  .nav:disabled{ opacity:.32; cursor:default; }
  @media (hover:hover) and (pointer:fine){ .nav{ display:flex; } }

  /* ── 하단 ── */
  footer{
    flex:0 0 auto; background:#fff; border-top:1px solid #E4E6E9;
    padding:12px 18px calc(14px + env(safe-area-inset-bottom));
  }
  .dots{ display:flex; gap:6px; justify-content:center; margin-bottom:11px; flex-wrap:wrap; }
  .dot{
    width:7px; height:7px; border-radius:50%; background:#D2D5D9;
    border:none; padding:0; cursor:pointer; transition:width .18s, background .18s;
  }
  .dot.on{ width:20px; border-radius:100px; background:var(--or); }
  .actions{ display:flex; gap:8px; }
  .btn{
    flex:1 1 0; text-align:center; text-decoration:none;
    font-size:13px; font-weight:700; letter-spacing:-0.4px;

  .meta{

  }

  /* ── 넓은 화면 ── */
  @media (min-width:820px){
    body{ max-width:560px; margin:0 auto; box-shadow:0 0 40px rgba(0,0,0,.07); }

    padding:10px 16px; border-radius:100px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:20;
  }

<script>
(function(){
  var track = document.getElementById('track');
  var dotsEl = document.getElementById('dots');
  var curEl = document.getElementById('cur');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var total = track.children.length;
  var idx = 0;

  for (var i = 0; i < total; i++) {
    var d = document.createElement('button');
    d.className = 'dot' + (i === 0 ? ' on' : '');
    d.setAttribute('aria-label', (i + 1) + '번째 카드');
    d.dataset.i = i;
    dotsEl.appendChild(d);
  }
  var dots = dotsEl.children;

  function go(i){
    i = Math.max(0, Math.min(total - 1, i));
    track.scrollTo({ left: track.clientWidth * i, behavior: 'smooth' });
  }

  function sync(){
    var i = Math.round(track.scrollLeft / track.clientWidth);
    if (i === idx) return;
    idx = i;
    curEl.textContent = idx + 1;
    for (var k = 0; k < dots.length; k++) dots[k].className = 'dot' + (k === idx ? ' on' : '');
    prev.disabled = (idx === 0);
    next.disabled = (idx === total - 1);
  }

  var tick;
  track.addEventListener('scroll', function(){
    if (tick) return;
    tick = requestAnimationFrame(function(){ tick = null; sync(); });
  }, { passive: true });

  dotsEl.addEventListener('click', function(e){
    if (e.target.dataset.i !== undefined) go(+e.target.dataset.i);
  });
  prev.addEventListener('click', function(){ go(idx - 1); });
  next.addEventListener('click', function(){ go(idx + 1); });
  prev.disabled = true;

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') go(idx - 1);
    if (e.key === 'ArrowRight') go(idx + 1);
  });

  window.addEventListener('resize', function(){
    track.scrollLeft = track.clientWidth * idx;
  });

  var toast = document.getElementById('toast');
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('on');
    setTimeout(function(){ toast.classList.remove('on'); }, 1800);
  }

  document.getElementById('share').addEventListener('click', function(){
    var data = { title: document.title, url: location.href };
    if (navigator.share) {
      navigator.share(data).catch(function(){});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(location.href).then(function(){
        showToast('링크를 복사했습니다');
      }).catch(function(){ showToast(location.href); });
    } else {
      showToast(location.href);
    }
  });
})();
</script>
